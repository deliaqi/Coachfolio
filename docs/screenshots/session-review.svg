  <circle cx="1018" cy="622" r="10" fill="#f3e7d7"/><path d="M1018 616v7m0 4v.1" stroke="#9a744f" stroke-width="1.8" stroke-linecap="round"/>
  <text x="1037" y="627" class="ink" font-size="13" font-weight="650">Explore “less scattered” further</text>
  <text x="1012" y="654" class="muted" font-size="12">Ask what that experience means to the</text><text x="1012" y="673" class="muted" font-size="12">client before moving into planning.</text>
