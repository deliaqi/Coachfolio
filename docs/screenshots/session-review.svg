  <rect x="318" y="320" width="619" height="107" rx="13" fill="#f8f7f2"/><rect x="318" y="337" width="3" height="72" rx="2" fill="#315f50"/><text x="336" y="354" class="muted" font-size="13" font-family="monospace">00:00</text><text x="401" y="354" class="forest" font-size="13" font-weight="650">Coach⌄</text>
  <text x="478" y="354" class="ink body">What would make this conversation useful for you today?</text>
  <text x="478" y="378" class="ink body">What would you like to leave with?</text>
  <rect x="318" y="439" width="619" height="118" rx="13" fill="#f8f7f2"/><rect x="318" y="455" width="3" height="86" rx="2" fill="#4c7896"/><text x="336" y="474" class="muted" font-size="13" font-family="monospace">00:12</text><text x="401" y="474" fill="#4c7896" font-size="13" font-weight="650">Client A⌄</text>
  <text x="478" y="474" class="ink body">I’d like to feel less scattered when I plan</text><text x="478" y="498" class="ink body">my week. I have a lot of priorities competing</text><text x="478" y="522" class="ink body">for my attention right now.</text>
  <rect x="318" y="569" width="619" height="107" rx="13" fill="#f8f7f2"/><rect x="318" y="586" width="3" height="72" rx="2" fill="#315f50"/><text x="336" y="603" class="muted" font-size="13" font-family="monospace">00:29</text><text x="401" y="603" class="forest" font-size="13" font-weight="650">Coach⌄</text>
  <text x="478" y="603" class="ink body">What feels most important to make room for?</text><text x="478" y="627" class="ink body">How will you know you’ve made progress?</text>
  <rect x="318" y="688" width="619" height="118" rx="13" fill="#f8f7f2"/><rect x="318" y="705" width="3" height="85" rx="2" fill="#4c7896"/><text x="336" y="723" class="muted" font-size="13" font-family="monospace">00:44</text><text x="401" y="723" fill="#4c7896" font-size="13" font-weight="650">Client A⌄</text>
  <text x="478" y="723" class="ink body">Finishing the project matters, and so does</text><text x="478" y="747" class="ink body">leaving room to rest. I want to be more</text><text x="478" y="771" class="ink body">intentional about both.</text>
  <text x="996" y="184" class="ink" font-size="18" font-weight="650">Practice review</text><text x="996" y="206" class="muted small">Transcript analysis with OpenAI</text>
