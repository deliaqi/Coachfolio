  <text x="996" y="357" class="muted" font-size="13">Client A wants to set weekly priorities</text><text x="996" y="378" class="muted" font-size="13">while protecting time to rest.</text>
  <rect x="996" y="398" width="379" height="1" fill="#eceee8"/>
  <text x="996" y="432" class="ink" font-size="15" font-weight="650">What went well</text>
